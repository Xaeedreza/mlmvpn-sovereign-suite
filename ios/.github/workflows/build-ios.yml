name: Build iOS IPA (MLMVPN Sovereign)

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go & XcodeGen
        run: |
          brew install xcodegen go
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Validate & normalize Info.plist and entitlements
        working-directory: ios
        run: |
          plutil -convert xml1 MLMVPNApp/Info.plist MLMVPNTunnel/Info.plist MLMVPNApp/MLMVPNApp.entitlements MLMVPNTunnel/MLMVPNTunnel.entitlements
          plutil -lint MLMVPNApp/Info.plist MLMVPNTunnel/Info.plist

      - name: Build Libbox.xcframework
        working-directory: ios
        run: |
          chmod +x scripts/build_libbox.sh
          ./scripts/build_libbox.sh || echo "Optional Libbox build skipped if gomobile unavailable"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS Archive & IPA
        working-directory: ios
        run: |
          xcodebuild clean archive \
            -project MLMVPNSovereign.xcodeproj \
            -scheme MLMVPNApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MLMVPNSovereign.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -r build/MLMVPNSovereign.xcarchive/Products/Applications/MLMVPNApp.app build/Payload/
          cd build && zip -r MLMVPNSovereign-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLMVPNSovereign-iOS-IPA
          path: ios/build/MLMVPNSovereign-unsigned.ipa
