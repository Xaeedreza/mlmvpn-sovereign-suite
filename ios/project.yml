name: MLMVPNSovereign
options:
  bundleIdPrefix: com.mlmvpn.sovereign
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "200"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  MLMVPNApp:
    type: application
    platform: iOS
    sources:
      - path: MLMVPNApp
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlmvpn.sovereign.app
        INFOPLIST_FILE: MLMVPNApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MLMVPNApp/MLMVPNApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MLMVPNTunnel
      - sdk: NetworkExtension.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Network.framework

  MLMVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: MLMVPNTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlmvpn.sovereign.app.tunnel
        INFOPLIST_FILE: MLMVPNTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: MLMVPNTunnel/MLMVPNTunnel.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: CryptoKit.framework
      - sdk: libresolv.tbd
