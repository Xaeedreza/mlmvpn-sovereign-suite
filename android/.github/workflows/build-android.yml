name: Build Android APKs (ARMv7 & ARMv8 & Universal)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36 & Build Tools 35.0.0
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          SDKMAN="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Fetch prebuilt AAR dependencies (wsnet, libv2ray, psiphontunnel-ns)
        working-directory: android
        run: |
          mkdir -p app/libs tmp_libs
          curl -fsSL -o app/libs/wsnet.aar "https://raw.githubusercontent.com/Windscribe/Android-App/2c585dd5979ba93655853d56d849ed8ad2c964cb/base/src/main/libs/wsnet.aar"
          curl -fsSL -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.26/libv2ray.aar"
          curl -fsSL -o tmp_libs/psiphon.zip "https://github.com/Psiphon-Labs/psiphon-tunnel-core/releases/download/v2.0.41/Psiphon-Android-Library.zip"
          unzip -q tmp_libs/psiphon.zip -d tmp_libs/psiphon_out
          PSIPHON_AAR="$(find tmp_libs/psiphon_out -name '*.aar' | head -n 1)"
          cp "$PSIPHON_AAR" app/libs/psiphontunnel.aar
          python3 scripts/repackage-psiphon-aar.py app/libs/psiphontunnel.aar
          rm -rf app/libs/psiphontunnel.aar tmp_libs
          ls -lh app/libs/

      - name: Assemble Signed Release APKs (armeabi-v7a, arm64-v8a, universal)
        working-directory: android
        run: |
          java -Xmx512m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease -PmlmTestSign --no-daemon

      - name: Upload Split & Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: MLMVPN-Sovereign-Android-APKs
          path: |
            android/app/build/outputs/apk/release/*.apk
