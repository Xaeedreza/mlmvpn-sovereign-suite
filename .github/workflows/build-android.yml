name: Build Android APKs (ARMv7 & ARMv8 & Universal)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36 & Build Tools 35.0.0
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          SDKMAN="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Assemble Release APKs (armeabi-v7a, arm64-v8a, universal)
        working-directory: android
        run: |
          java -Xmx512m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon

      - name: Upload Split & Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: MLMVPN-Sovereign-Android-APKs
          path: |
            android/app/build/outputs/apk/release/*.apk
